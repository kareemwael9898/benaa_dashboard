name: benaa_dashboard
description: "Benaa admin dashboard — financial returns (العوائد المالية) screen."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (Cubit)
  flutter_bloc: ^9.1.1

  # Responsive sizing / typography
  flutter_screenutil: ^5.9.3

  # Local storage / caching only (never shared_preferences)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # PDF report generation + OS hand-off (share sheet / print / download)
  pdf: ^3.12.0
  printing: ^5.14.3

  # Pinned: `pdf` requires archive <4.1.0, and image 4.11.0 is the first
  # release that calls ZLibDecoder.decodeLazy (added in archive 4.1.0), which
  # breaks the compile. Lift this once pdf widens its archive constraint.
  image: ">=4.10.1 <4.11.0"

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    # Variable font: weight is applied per-style via fontVariations.
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
